name: Sync projects from Notion

on:
  schedule:
    # 14:00 UTC daily (07:00 PT) — edits made in Notion the day before are live by morning.
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch Notion rows and update _data/projects.json
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/sync-projects.mjs

      # A push made with GITHUB_TOKEN does not trigger other workflows, so
      # deploy.yml would never see this commit. Dispatching it explicitly is
      # the one cross-workflow trigger GITHUB_TOKEN is allowed.
      - name: Commit, push and deploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet _data/projects.json; then
            echo "No project changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/projects.json
          git commit -m "chore(projects): sync from Notion ($(date -u +%Y-%m-%d))"
          git push
          gh workflow run deploy.yml --ref master
