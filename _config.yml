# Jekyll config for canonical.cc — enables _includes processing on GitHub Pages.
# Bump asset_version to cache-bust css/js across the whole site in one place.
asset_version: 20260819a

# Absolute base for generated URLs (sitemap entries, feeds).
url: https://canonical.cc

# jekyll-sitemap is part of the github-pages gem set the deploy workflow
# installs, so it needs no Gemfile change. Generates /sitemap.xml, which answer
# engines and AI crawlers use for discovery.
plugins:
  - jekyll-sitemap

# Jekyll skips dot-directories by default, which would silently drop the whole
# agent-discovery surface (/.well-known/api-catalog, the agent-skills index and
# its SKILL.md files). Naming it here is the only way it ships.
include:
  - .well-known

exclude:
  - Website.zip
  - labs/fundmodeler
  - README.md
  # Build/authoring tooling — never served. (Also keeps check-built-site.sh,
  # which names retired assets by design, out of its own scan.)
  - scripts
